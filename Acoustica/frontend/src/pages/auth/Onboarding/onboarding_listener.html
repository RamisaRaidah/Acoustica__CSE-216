<div class="auth-container">
    <div class="auth-logo">
        <img src="/src/assets/images/Deco/Logo.png" id="logo" alt="Aaaa logoooo" >
        <img src="/src/assets/images/auth/name_2.png" id="acoustica" alt="Acoustica">
    </div>
    <div class="auth-left">
        <p class="typewriter" id="typewriter"></p>
        <div class="auth-underline"></div>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <h1>Set Up Your Profile</h1>
        </div>

        <form id="onboarding-form" class="auth-form">
            
            <div class="form-group">
                <label for="pfp">Profile Picture</label>
                <input 
                    type="file" 
                    id="pfp" 
                    name="pfp" 
                    accept="image/png, image/jpeg, image/webp" 
                />
            </div>

            <div class="form-group">
                <img 
                id="pfp-preview" 
                style="display:none; 
                width:80px; 
                height:80px; 
                border-radius:50%;"
                >
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea 
                id="bio" 
                name="bio" 
                placeholder="Tell us about yourself..."
                maxlength="200"></textarea>
                <small id="bio-counter" style="color: #5c6465; text-align: right;">0/200</small>
            </div>

            <div class="form-group">
                <label for="country_id">Country</label>
                <select id="country_id" name="country_id" required>
                    <option value="">Loading countries...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="language_id">Language</label>
                <select id="language_id" name="language_id" required>
                    <option value="">Loading languages...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone_number" 
                    name="phone_number" 
                    placeholder="e.g. +1234567890" 
                    required
                />
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Prefer not to say</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input 
                    type="date" 
                    id="date_of_birth"
                    name="date_of_birth" 
                    required
                />
            </div>

            <div class="form-group">
                <label for="theme">Theme</label>
                <select id="theme" name="theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
          
            <div id="error-message" class="error-message"></div>

            <button type="submit" class="btn-primary" id="onboarding-btn">
                Let's Go
            </button>
        </form>
    </div>
</div>

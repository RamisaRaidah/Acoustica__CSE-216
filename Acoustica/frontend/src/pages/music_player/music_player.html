<div class="player-container">
    <div class="album-art" id="albumArt">🎵</div>
    
    <div class="song-info">
        <div class="song-title" id="songTitle">Loading...</div>
        <div class="song-artist" id="songArtist">Unknown Artist</div>
    </div>

    <div class="progress-container">
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn" id="prevBtn">⏮</div>
        <div class="control-btn play-btn" id="playBtn">▶</div>
        <div class="control-btn" id="nextBtn">⏭</div>
    </div>

    <div class="volume-container">
        <div class="volume-icon" id="volumeIcon">🔊</div>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
    </div>

    <div class="loading" id="loadingText"></div>
</div>

<!-- Hidden audio element -->
<audio id="audio"></audio>

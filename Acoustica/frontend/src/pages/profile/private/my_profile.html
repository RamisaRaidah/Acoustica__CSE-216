<div class="profile-page">

    <div class="page-header">
        <h1>My Profile</h1>
    </div>

    <div class="profile-layout">

        <!-- Left -->
        <div class="profile-left">
            <div class="identity-card">
                <div class="pfp-ring">
                    <img id="profile-pfp" src="" alt="Profile picture" />
                </div>
                <div class="profile-name" id="profile-name">—</div>
                <div class="profile-badge" id="profile-badge">⬤ &nbsp;listener</div>
                <p class="profile-bio" id="profile-bio">No bio yet.</p>
            </div>
        </div>

        <!-- Right -->
        <div class="profile-right">

            <div class="info-card">
                <div class="card-header">
                    <div class="card-icon">👤</div>
                    <h2>Personal Info</h2>
                </div>
                <div class="info-row"><span class="info-label">First Name</span><span class="info-value" id="field-first-name">—</span></div>
                <div class="info-row"><span class="info-label">Last Name</span><span class="info-value" id="field-last-name">—</span></div>
                <div class="info-row"><span class="info-label">Gender</span><span class="info-value" id="field-gender">—</span></div>
                <div class="info-row"><span class="info-label">Date of Birth</span><span class="info-value" id="field-dob">—</span></div>
                <div class="info-row"><span class="info-label">Country</span><span class="info-value" id="field-country">—</span></div>
                <div class="info-row"><span class="info-label">Language</span><span class="info-value" id="field-language">—</span></div>
            </div>

            <div class="info-card">
                <div class="card-header">
                    <div class="card-icon">🔐</div>
                    <h2>Account Info</h2>
                </div>
                <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="field-email">—</span></div>
                <div class="info-row"><span class="info-label">Phone Number</span><span class="info-value" id="field-phone">—</span></div>
                <div class="info-row"><span class="info-label">Theme</span><span class="info-value" id="field-theme">—</span></div>
            </div>

            <div class="info-card" id="role-card">
                <div class="card-header">
                    <div class="card-icon" id="role-card-icon">🎵</div>
                    <h2 id="role-card-title">Details</h2>
                </div>
                <div id="role-card-body"></div>
            </div>

        </div>
    </div>
</div>

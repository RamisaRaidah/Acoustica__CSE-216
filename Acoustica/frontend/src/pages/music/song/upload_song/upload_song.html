<div id="upload_song_container">
  <form id="upload_song_form" enctype="multipart/form-data">
    
    <!-- Song Title -->
    <div class="form_group">
      <label>Song Title</label>
      <input 
        type="text" 
        id="song_title" 
        name="song_title" 
        placeholder="Enter song title"
        required
      >
    </div>

    <!-- Album -->
    <div class="form_group">
      <label>Album</label>
      <div class="input-group">
        <select id="album_select" name="album_id" required>
          <option value="" disabled selected>Select an album</option>
        </select>

        <button type="button" id="new_album_button" class="btn-side">
          + New
        </button>
      </div>
    </div>

    <!-- Collaborators -->
    <div class="form_group">
  <label>Collaborators</label>

  <div class="input-group">
    <select id="collaborator_select">
      <option value="" disabled selected>Select artist</option>
    </select>

    <select id="collaborator_role_select">
      <option value="" disabled selected>Select role</option>
      <option value="vocalist">Vocalist</option>
      <option value="lyricist">Lyricist</option>
      <option value="composer">Composer</option>
    </select>
  </div>

  <div id="selected_collaborators" class="selected_items"></div>

  <input type="hidden" name="collaborators" id="collaborators_input">
</div>

    <!-- Language -->
    <div class="form_group">
      <label>Language</label>
      <select id="language_select" name="language" required>
        <option value="" disabled selected>Select language</option>
      </select>
    </div>

    <!-- Genres -->
    <div class="form_group">
      <label>Genres</label>

      <select id="genre_select">
        <option value="" disabled selected>Select genre</option>
      </select>

      <div id="selected_genres" class="selected_items"></div>

      <input type="hidden" name="genres" id="genres_input">
    </div>

    <!-- Moods -->
    <div class="form_group">
      <label>Moods</label>

      <select id="mood_select">
        <option value="" disabled selected>Select mood</option>
      </select>

      <div id="selected_moods" class="selected_items"></div>

      <input type="hidden" name="moods" id="moods_input">
    </div>

    <!-- Instruments -->
    <div class="form_group">
      <label>Instruments</label>

      <select id="instrument_select">
        <option value="" disabled selected>Select instrument</option>
      </select>

      <div id="selected_instruments" class="selected_items"></div>

      <input type="hidden" name="instruments" id="instruments_input">
    </div>

    <!-- Release Date -->
    <div class="form_group">
      <label>Release Date</label>
      <input 
        type="date" 
        id="release_date" 
        name="release_date" 
        required
      >
    </div>

    <!-- Audio File -->
    <div class="form_group">
      <label>Audio File</label>
      <input 
        type="file" 
        id="song_file" 
        name="song_file" 
        accept=".mp3,.wav"
        required
      >
    </div>

    <!-- Lyrics -->
    <div class="form_group">
      <label>Lyrics (optional)</label>
      <input 
        type="file" 
        id="lyrics_file" 
        name="lyrics_file" 
        accept=".txt"
      >
    </div>

    <!-- Copyright Certificate -->
    <div class="form_group">
      <label>Copyright Certificate</label>
      <input 
        type="file" 
        id="copyright_certificate" 
        name="copyright_certificate" 
        accept=".pdf"
        required
      >
    </div>

    <button type="submit">Upload</button>

  </form>
</div>

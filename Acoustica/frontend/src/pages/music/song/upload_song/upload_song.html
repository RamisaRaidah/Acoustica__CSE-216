<div id="upload_song_container">
  <form id="upload_song_form" enctype="multipart/form-data">
    
    <!-- Song Title -->
    <div class="form_group">
      <label for="song_title">Song Title</label>
      <input 
        type="text" 
        id="song_title" 
        name="song_title" 
        placeholder="Enter song title"
        required
      >
    </div>

    <!-- Album -->
    <div class="form_group">
      <label for="album_select">Album</label>
      <div class="input-group">
        <select id="album_select" name="album_id">
          <option value="" disabled selected>Select an existing album</option>
        </select>
        
        <button type="button" id="create_album_button" class="btn-side" title="Create New Album">
          + New
        </button>
      </div>
    </div>

    <!-- Language -->
    <div class="form_group">
      <label for="language_select">Language</label>
      <select id="language_select" name="language" required>
        <option value="" disabled selected>Select language</option>
      </select>
    </div>

    <!-- Release Date -->
    <div class="form_group">
      <label for="release_date">Release Date</label>
      <input 
        type="date" 
        id="release_date" 
        name="release_date" 
        required
      >
    </div>

    <!-- Audio File -->
    <div class="form_group">
      <label for="song_file">Audio File</label>
      <input 
        type="file" 
        id="song_file" 
        name="song_file" 
        accept=".mp3,.wav"
        required
      >
    </div>

    <!-- Lyrics (optional) -->
    <div class="form_group">
      <label for="lyrics_file">Lyrics (optional)</label>
      <input 
        type="file" 
        id="lyrics_file" 
        name="lyrics_file" 
        accept=".txt"
      >
    </div>

    <!-- Copyright Certificate -->
    <div class="form_group">
      <label for="copyright_certificate">Copyright Certificate</label>
      <input 
        type="file" 
        id="copyright_certificate" 
        name="copyright_certificate" 
        accept=".pdf"
        required
      >
    </div>

    <button type="submit">Upload Song</button>

  </form>
</div>

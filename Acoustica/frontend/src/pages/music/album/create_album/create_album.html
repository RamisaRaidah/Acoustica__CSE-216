<div id="create_album_container">
  <form id="create_album_form" enctype="multipart/form-data">
    
    <!-- Album Title -->
    <div class="form_group">
      <label for="album_title">Album Title</label>
      <input 
        type="text" 
        id="album_title" 
        name="album_title" 
        placeholder="Enter album title"
        required
      >
    </div>

    <!-- Description (optional) -->
    <div class="form_group">
      <label for="description">Description (optional)</label>
      <input 
        type="text" 
        id="description" 
        name="description" 
      >
    </div>

    <!-- Release Date -->
    <div class="form_group">
      <label for="release_date">Release Date</label>
      <input 
        type="date" 
        id="release_date" 
        name="release_date" 
        required
      >
    </div>

    <!-- Cover picture -->
    <div class="form_group">
      <label for="cover_picture">Cover Picture</label>
      <input 
        type="file" 
        id="cover_picture" 
        name="cover_picture" 
        accept=".jpg"
      >
    </div>

    <!-- Copyright Certificate -->
    <div class="form_group">
      <label for="copyright_certificate">Copyright Certificate (PDF)</label>
      <input 
        type="file" 
        id="copyright_certificate" 
        name="copyright_certificate" 
        accept=".pdf"
        required
      >
    </div>

    <button type="submit">Upload Song</button>

  </form>
</div>
